<!doctype html><html style="background:white"><head><meta charset="utf-8"><title>白底穿透测试</title></head>
<body style="background:white;color:#16352d;padding:40px;font-family:Microsoft YaHei UI">
<h1>白色页面背景穿透</h1><p>文字、图片、视频和交互控件保持自身内容。</p>
<div id="white" style="background:#fff;width:400px;height:120px">白色内容区</div>
<div id="color" style="background:rgb(30,90,70);color:white;padding:20px">有色背景保留</div>
<input id="input" style="background:white" value="输入框保留白底，可点击" />
<img id="image" style="background:white" src="App.png" width="90"/><canvas id="canvas" style="background:white" width="90" height="60"></canvas>
<video id="video" style="background:white" width="90" height="60"></video>
<script>
window.clicks=0;window.trusted=false;
document.getElementById('white').addEventListener('click',e=>{clicks++;trusted=e.isTrusted});
window.moves=0;document.addEventListener('mousemove',()=>moves++);
</script>
</body></html>
